<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Plan · Learning Hub</title>
<meta name="theme-color" content="#0a0c13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Learning">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body class="t-eng">
<div class="wrap">
  <h1>8-Week <span class="grad">English Plan</span></h1>
  <p class="sub">CELPIP 9 / 9 / 7 / 6 → higher writing &amp; speaking, plus real fluency at work · ~100 min/day</p>

  <div class="card glow" style="margin-bottom:20px">
    <div class="nums" style="margin:0 0 10px"><b id="ovPct">0%</b><span id="ovCnt"></span></div>
    <div class="bar"><i id="ovBar" style="width:0%"></i></div>
  </div>

  <h2 class="sec">Pick a day</h2>
  <div class="rail-wrap"><div class="rail" id="dvRail"></div></div>
  <div id="dvDay"></div>

  <h2 class="sec">Reference &amp; tools</h2>
  <div class="tabbar" id="refTabs"></div>
  <div id="refBody"></div>
</div>

<script src="assets/ui.js"></script>
<script>window.PAGE_TRACK="eng";</script>
<script src="assets/hub.js"></script>
<script>Hub.init({page:"eng"});</script>
<script src="assets/data-ai.js"></script>
<script src="assets/data-eng.js"></script>
<script src="assets/ref-eng.js"></script>
<script src="assets/books.js"></script>
<script src="assets/plans.js"></script>
<script src="assets/ask.js"></script>
<script src="assets/day.js"></script>
<script src="assets/ref.js"></script>
<script>
function paintOverall(){
  var p = PLANS.progress("eng");
  document.getElementById("ovBar").style.width = p.pct + "%";
  document.getElementById("ovPct").textContent = p.pct + "%";
  document.getElementById("ovCnt").textContent = p.done + " / " + p.total + " tasks done";
}
window.onHubProgress = paintOverall;
document.addEventListener("DOMContentLoaded", function(){
  DayView.mount({ track:"eng", railEl:"dvRail", dayEl:"dvDay", autoFocus: location.hash === "#focus" });
  REF.mount("eng", "refTabs", "refBody");
  paintOverall();
});
Hub.onChange(function(){ if(!document.getElementById("hubModal").classList.contains("on")) location.reload(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
